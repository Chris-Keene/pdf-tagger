      review ? el("span",{class:"flag","aria-hidden":"true",text:"?"}) : null]);
    stage.appendChild(b);
  });
  p.appendChild(zoomRow());
  view.appendChild(stage);
  p.appendChild(view);
  const leg = [lg("var(--navy)","Heading"), lg("var(--blue)","Text"),
    lg("var(--purple)","List"), lg("var(--pink)","Image"), lg("#6B7280","Ignored")];
  if((pg.tables||[]).length) leg.push(lg("var(--teal)","Table"));
  p.appendChild(el("div",{class:"legend"},leg));
  if(S.assist.on){
    const bar = el("div",{class:"row",style:"gap:.5rem;margin:.6rem 0 0;flex-wrap:wrap"});
    bar.appendChild(el("button",{class:"mini act",type:"button",
      disabled:S.assist.busy?"disabled":null,
      text:S.assist.busy?"Checking\u2026":"Check this page's reading order",
      onclick:()=> assistRun("order", {page:S.page}, j=>{
        S.orderNotes = {page:j.page, problems:j.problems||[]};
        render();
        say((j.problems||[]).length
          ? (j.problems.length+" place"+(j.problems.length===1?"":"s")+" worth a look")
          : "That page reads in a sensible order");
      })}));
    bar.appendChild(el("span",{class:"hint",style:"margin:0",
      text:"Sends the words and their positions, never the page image."}));
    p.appendChild(bar);
    const notes = S.orderNotes;
    if(notes && notes.page === S.page){
      if(!notes.problems.length){
        p.appendChild(el("p",{class:"hint",text:"Claude found nothing out of order here."}));
      } else {
        const ul = el("ul",{class:"ordernotes"});
        notes.problems.forEach(pr=>{
          ul.appendChild(el("li",{},[
            el("button",{class:"mini jump",type:"button",
              text:"Item "+pr.position,
              onclick:()=>{ S.sel=pr.id; S.itemTo=pr.id;
                const e=findEl(pr.id); if(e) focusOn(e); render(); }}),
            el("span",{text:" "+pr.why})]));
        });
        p.appendChild(el("p",{class:"hint",style:"margin:.5rem 0 .2rem",
          text:"Claude thinks these read out of order. It is a suggestion, not a change."}));
        p.appendChild(ul);
      }
    }
  }

  const tp = tablesPanel(pg);
  if(tp) p.appendChild(tp);

  // A single remembered point of interest, held as a fraction of the page, so a
  // zoom keeps looking at whatever you were looking at and an ordinary re-render
  // does not move the view at all.
  //
  // It is deliberately *not* recomputed from the selection on every render. It
  // used to be, which meant clicking a box while zoomed in re-centred that box:
  // a click meant as "grab here to drag" threw the page across the viewport
  // instead. Panning now sets the focus, and only the item list moves it.
  view.addEventListener("scroll", ()=> noteFocus(view), {passive:true});

  if(S.zoom > 1 && S.focus){
    const img = stage.querySelector("img");
    // A scroll assignment is clamped to the element's *current* scrollable
    // range, and until the image has loaded the stage has almost no height, so
    // writing scrollTop early is silently rounded to 0. Wait for the image, then
    // one turn of the loop for layout, then write.
    // setTimeout rather than requestAnimationFrame: rAF does not fire when the
    // page is not painting (a background tab, or a headless context), so the
    // scroll would silently never happen. A timeout always runs.
    const put = ()=> setTimeout(()=>{
      view.scrollLeft = Math.max(0, S.focus.x * view.scrollWidth - view.clientWidth / 2);
      view.scrollTop  = Math.max(0, S.focus.y * view.scrollHeight - view.clientHeight / 2);
    }, 0);
    if(img && img.complete && img.naturalHeight) put();
    else if(img) img.addEventListener("load", put, {once:true});
  }
  return p;
}
const lg=(c,t)=> el("span",{},[el("i",{style:"border-color:"+c,"aria-hidden":"true"}),
                              el("span",{text:t})]);

const ZOOM_STEPS = [1, 1.5, 2, 3, 4];

/* Drag to pan, on top of ordinary scrolling. The boxes are buttons covering most
   of the page, so a drag almost always starts on one: movement past a small
   threshold counts as a pan and the click that follows is swallowed, otherwise it
   stays a click and selects the item. */
// Record what the view is centred on, as a fraction of the page.
// Called straight from the pan handler rather than relying only on scroll events:
// those are frame-aligned and do not fire at all in a context that is not
// painting, which would leave the focus stale and make a later zoom jump.
function noteFocus(view){
  if(S.zoom <= 1) return;
  const w = view.scrollWidth, h = view.scrollHeight;
  if(!w || !h) return;
  S.focus = {x:(view.scrollLeft + view.clientWidth / 2) / w,
             y:(view.scrollTop + view.clientHeight / 2) / h};
}

function attachPan(view){
  let panning=false, moved=false, sx=0, sy=0, ox=0, oy=0, pid=null;
  view.addEventListener("pointerdown", e=>{
    if(e.button !== 0) return;
    panning=true; moved=false; pid=e.pointerId;
    sx=e.clientX; sy=e.clientY;
    ox=view.scrollLeft; oy=view.scrollTop;
  });
  view.addEventListener("pointermove", e=>{
    if(!panning || e.pointerId !== pid) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(!moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    if(!moved){
      moved = true;
      view.style.cursor = "grabbing";
      // Capture only once a drag has really started, so a quick drag that runs
      // outside the frame keeps panning instead of letting go halfway across.
      // Not on pointerdown: capture retargets the click that follows to the
      // capturing element, so every plain click on a box would stop selecting it.
      try{ view.setPointerCapture(pid); }catch(_){}
    }
    view.scrollLeft = ox - dx;
    view.scrollTop  = oy - dy;
    noteFocus(view);
    e.preventDefault();
  });
  const end = ()=>{
    if(!panning) return;
    panning = false; view.style.cursor = "";
    if(pid !== null){ try{ view.releasePointerCapture(pid); }catch(_){} pid = null; }
  };
  view.addEventListener("pointerup", end);
  view.addEventListener("pointercancel", end);
  view.addEventListener("click", e=>{
    if(moved){ e.preventDefault(); e.stopPropagation(); moved = false; }
  }, true);
}

function setZoom(z, announce){
  const clamped = Math.max(1, Math.min(4, z));
  if(clamped === S.zoom) return;
  if(!S.focus) S.focus = {x:0.5, y:0.5};   // zoom into the middle, not the corner
  S.zoom = clamped;
  render();
  if(announce !== false) say(clamped === 1
    ? "Zoom reset to fit the page"
    : "Zoomed to "+Math.round(clamped*100)+" percent");
}

function zoomRow(){
  const i = ZOOM_STEPS.indexOf(S.zoom);
  const at = i === -1 ? 0 : i;
  const row = el("div",{class:"zoomrow"});
  // Grouped: four related view controls read as one cluster rather than four
  // buttons that happen to sit next to each other.
  const seg = el("div",{class:"seg",role:"group","aria-label":"Page preview zoom"});
  seg.appendChild(el("button",{class:"mini",type:"button",text:"−",
    "aria-label":"Zoom out of the page preview",
    disabled: at <= 0 ? "disabled" : null,
    onclick:()=> setZoom(ZOOM_STEPS[Math.max(0, at-1)])}));
  seg.appendChild(el("span",{class:"pct",role:"status",
    "aria-label":"Page preview zoom "+Math.round(S.zoom*100)+" percent",
    text:Math.round(S.zoom*100)+"%"}));
  seg.appendChild(el("button",{class:"mini",type:"button",text:"+",
    "aria-label":"Zoom into the page preview",
    disabled: at >= ZOOM_STEPS.length-1 ? "disabled" : null,
    onclick:()=> setZoom(ZOOM_STEPS[Math.min(ZOOM_STEPS.length-1, at+1)])}));
  seg.appendChild(el("button",{class:"mini",type:"button",text:"Fit",
    "aria-label":"Reset the page preview to fit the width",
    disabled: S.zoom === 1 ? "disabled" : null,
    onclick:()=> setZoom(1)}));
  row.appendChild(seg);
  if(S.help) row.appendChild(el("span",{class:"hint2",
    text: S.zoom > 1
      ? "Scroll, drag, or use the arrow keys to move around. Selecting an item brings it into view."
      : "Zoom in where boxes sit close together and are hard to tell apart."}));
  return row;
}

function itemsPanel(){
  const p = el("div",{class:"panel"});
  const head = el("div",{class:"labelrow"},[
    el("h3",{text:"Items on page "+(S.page+1),style:"margin:0"})]);
  const rh = helpFor("roles");
  if(rh[0]) head.appendChild(rh[0]);
  p.appendChild(head);
  if(rh[1]) p.appendChild(rh[1]);
  p.appendChild(el("p",{class:"hint",
    text:"In reading order. Use Up and Down to change where something is read."}));
  if(S.help){
    // The three ideas people actually need here, as named buttons rather than a
    // row of anonymous question marks.
    const row = el("div",{class:"row",style:"gap:.4rem;margin:.1rem 0 .6rem;flex-wrap:wrap"});
    const panels = [];
    [["headings","What is a heading?"],["lists","What is a list?"],
     ["order","What is reading order?"],
     ["grouping","Splitting and joining"]].forEach(([topic,lbl])=>{
      const [btn, panel] = helpFor(topic);
      if(!btn) return;
      btn.textContent = lbl;
      btn.className = "mini info";
      btn.removeAttribute("style");
      row.appendChild(btn);
      panels.push(panel);
    });
    p.appendChild(row);
    panels.forEach(x=> p.appendChild(x));
  }
  const list = el("ul",{class:"items"});
  // Put the list back where it was, for the same reason as the page strip: it is
  // rebuilt on every render, and after reordering an item near the bottom it
  // otherwise jumps back to the top, losing the place you were working in.
  setTimeout(()=>{
    if(!list.isConnected) return;
    // An explicit "show me this one" wins over putting the scroll back. Clicking
    // a box on the page has to bring its row into view, and restoring the old
    // position would undo that.
    if(S.itemTo){
      const row = list.querySelector('[data-item="'+S.itemTo+'"]');
      S.itemTo = null;
      if(row){ row.scrollIntoView({block:"center"}); S.itemScroll = list.scrollTop; return; }
    }
    list.scrollTop = S.itemScroll || 0;
  }, 0);
  const live = liveOn(S.page);
  let shown = S.hideIgnored ? live : allOn(S.page);
  if(S.onlyCheck) shown = shown.filter(needsReview);
  if(!shown.length) list.appendChild(el("li",{},[el("p",{class:"note",
    text: S.onlyCheck
      ? "Nothing on this page needs checking. Turn the filter off to see everything."
      : "Nothing was found on this page. If the slide has words on it, they may be part of an image, so describe it on the Images step."})]));
  shown.forEach(e=>{
    const isArt = e.role==="Artifact";
    const sel = el("select",{"aria-label":"Role for "+
      (e.kind==="image"?"image":"“"+(e.text||"empty").slice(0,40)+"”")},
      S.roleGroups.map(([g,rs])=> el("optgroup",{label:g},
        rs.map(r=> el("option",{value:r,text:label(r),
          selected:e.role===r?"selected":null})))));
    sel.onchange = ()=>{
      const was=e.role; e.role=sel.value;
      // Choosing a role is an explicit decision, so it counts as reviewed.
      markReviewed(e);
      if(was==="Artifact"&&e.role!=="Artifact") e.order = live.length;
      renumber(e.page); S.sel=e.id; save(0); render();
      say("Set to "+label(e.role)+", and marked as checked.");
    };
    // The boxes drawn on the page have to match the real geometry of the content,
    // so some are smaller than the 24px WCAG 2.2 asks of a target.  This row is
    // the full-size equivalent control for the same job, which is what the
    // "essential" exception requires you to provide.
    const pick = el("button",{class:"txt",type:"button",
      "aria-pressed":String(S.sel===e.id),
      "aria-label":"Highlight on the page: "+
        (e.kind==="image" ? "image" : (e.text||"empty").slice(0,60)),
      title:e.text||"",
      text:e.kind==="image"?"▦ image":(e.text||"(empty)"),
      onclick:()=>{ S.sel = S.sel===e.id?null:e.id;
        if(S.sel) focusOn(e);
        render();
        const b=document.querySelector('[aria-label^="'+(isArt?"Ignored":"Item "+(e.order+1))+'"]');
        if(b) b.scrollIntoView({block:"nearest"}); }});
    // Only the handle starts a drag, so selecting text or using the role menu
    // inside the row never turns into one.
    const grip = isArt ? null : el("span",{class:"grip","aria-hidden":"true",
      title:"Drag to move in the reading order", text:"⠿"});
    const row = el("div",{class:"row"},[
      grip,
      el("span",{class:"ord","aria-hidden":"true",text:isArt?"–":String(e.order+1)}),
      pick, sel]);
    // Name each control after the item it acts on: a screen reader user tabbing
    // a long page otherwise hears "move earlier" a dozen times over.
    const what = e.kind==="image" ? "the image" : "“"+(e.text||"empty").slice(0,40)+"”";
    const ctl = el("div",{class:"row",style:"margin-top:.35rem"},[
      el("button",{class:"mini step",type:"button","data-mv":e.id+"--1",
        "aria-label":"Move "+what+" earlier in the reading order",text:"↑",
        disabled:(isArt||e.order===0)?"disabled":null, onclick:()=>move(e.id,-1)}),
      el("button",{class:"mini step",type:"button","data-mv":e.id+"-1",
        "aria-label":"Move "+what+" later in the reading order",text:"↓",
        disabled:(isArt||e.order>=live.length-1)?"disabled":null, onclick:()=>move(e.id,1)}),
      canSplit(e) ? el("button",{class:"mini act",type:"button",
        "aria-label":"Split "+what+" into separate items",
        text:"Split", onclick:()=>splitItem(e.id)}) : null,
      // Offered only where it can actually work: text never joins to an image.
      (!isArt && e.order>0 && (live[e.order-1]||{}).kind === e.kind)
        ? el("button",{class:"mini act",type:"button",
            "aria-label":"Join "+what+" onto the item before it",
            text:"Join up", onclick:()=>mergeUp(e.id)}) : null,
      e.role==="LI"||e.role==="LI-ordered"
        ? el("span",{class:"lvl",text:"nesting level "+e.level}) : null,
      e.role!==e.auto_role ? el("span",{class:"badge chg",text:"changed"}) : null,
      (e.reviewed && e.kind==="text" && !isArt)
        ? el("span",{class:"badge ok",text:"✓ checked"}) : null
    ]);
    const review = needsReview(e);
    const li = el("li",{class:(S.sel===e.id?"sel ":"")+(review?"check":""),
      "data-item":e.id},[row,ctl]);
    if(!isArt) attachDrag(li, grip, e);

    if(e.kind==="text" && !isArt){
      // Show the confidence on everything, not just the doubtful ones: seeing
      // "Confident" on most rows is what makes the flagged ones mean something.
      li.appendChild(el("div",{class:"conf"},[
        el("span",{class:"num",text:e.reviewed&&e.score>=100?"From the file":confLabel(e.score)}),
        el("span",{class:"bar"+(e.score>=REVIEW_THRESHOLD?" good":""),
          role:"img","aria-label":"Confidence "+e.score+" out of 100"},
          [el("i",{style:"width:"+Math.max(4,e.score)+"%"})])
      ]));
    }
    if(review || (S.sel===e.id && e.note)){
      li.appendChild(el("p",{class:review?"reason":"note",text:e.note}));
    }
    if(review){
      li.appendChild(el("div",{class:"actions"},[
        el("button",{class:"mini commit",type:"button",
          "aria-label":"Mark “"+(e.text||"this item").slice(0,40)+"” as checked, keeping "+label(e.role),
          text:"Looks right",
          onclick:()=>{ markReviewed(e); save(0); render();
            say("Marked as checked. "+toCheck().length+" left to check."); }}),
        el("span",{class:"lvl",text:"or change the role above"})
      ]));
    }
    list.appendChild(li);
  });
  p.appendChild(list);
  return p;
}

/* ---------- step 3: images ---------- */
/* Form fields need a name, for the same reason an image needs a description: it
   is the only thing a screen reader has to announce. Without one the field reads
   as "edit text" and nothing else, and PDF/UA fails the file for it (7.18.1).
   The name is proposed from the label printed beside the field, which is right
   often enough to be worth offering and wrong often enough to need confirming. */
function hasFields(){
  return S.doc.pages.some(p=> p.elements.some(e=> e.kind==="field"));
}
function fieldsPanel(v){
  const fields = [];
  S.doc.pages.forEach(p=> p.elements.forEach(e=>{ if(e.kind==="field") fields.push(e); }));
  if(!fields.length) return;
  const need = fields.filter(e=> !(e.alt||"").trim()).length;
  const box = el("div",{class:"panel"});
  const head = el("div",{class:"pagehead"},[
    el("h3",{text: fields.length===1 ? "One form field" : fields.length+" form fields"}),
    el("span",{class:"of", text: need
      ? need+(need===1?" still has no name":" still have no name")
      : "all named"})]);
  box.appendChild(head);
  box.appendChild(el("p",{class:"hint",
    text:"Someone filling this in with a screen reader hears only the name you give "+
         "each field. Where a label is printed beside the field, it has been proposed."}));
  const list = el("ul",{class:"figs"});
  fields.forEach(e=>{
    const li = el("li",{"data-field":e.id});
    const lab = el("label",{class:"lbl",
      text:"Name for the field on page "+(e.page+1)});
    const box2 = el("input",{type:"text", class:"alt", value:e.alt||"",
      placeholder:"What is this field for?",
      "aria-describedby": e.note ? "fn-"+e.id : null});
    box2.oninput = ()=>{ e.alt = box2.value; markReviewed(e); save(); renderFoot(); };
    li.appendChild(lab); li.appendChild(box2);
    if(e.note) li.appendChild(el("p",{class:"why",id:"fn-"+e.id,text:e.note}));
    list.appendChild(li);
  });
  box.appendChild(list);
  v.appendChild(box);
}

/* Optional help from Claude. Off until it is switched on, and switched on per
   session rather than remembered, because the thing being sent is whatever
   document happens to be open and that changes. */
async function assistDetect(){
  try{
    const j = await api("/api/assist",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"detect"})});
    S.assist.route = j.assist.route; S.assist.label = j.assist.label;
    // Detection is async and the first render has already happened by the time it
    // lands, so draw again or the panel never appears.
    if(S.loaded) render();
  }catch(err){ S.assist.route = null; S.assist.label = ""; }
}
function assistPanel(){
  if(!S.assist.route) return null;
  const box = el("div",{class:"panel assist"});
  const head = el("div",{class:"pagehead"},[
    el("h3",{text:"Use Claude for the two things a script cannot do"}),
    el("span",{class:"of", text: S.assist.on ? "on for this document" : "off"})]);
  box.appendChild(head);
  box.appendChild(el("p",{class:"hint",
    text:"It can draft a description for each image and check whether a page reads "+
         "in a sensible order. Both come back as suggestions: nothing is accepted "+
         "for you, and a draft you have not read still counts as outstanding."}));
  box.appendChild(el("p",{class:"lim",
    text:"Switching this on sends content out of this Mac. Descriptions send a crop "+
         "of the image itself; the reading-order check sends only the words and "+
         "where they sit, never a picture. Nothing is sent until you ask for it, "+
         "and nothing is sent at all while this is off."}));
  const row = el("div",{class:"row",style:"gap:.5rem;flex-wrap:wrap"});
  row.appendChild(el("button",{class:"mini toggle",type:"button",
    "aria-pressed":String(S.assist.on),
    text: S.assist.on ? "Turn off" : "Turn on for this document",
    onclick:()=>{ S.assist.on = !S.assist.on; render();
      say(S.assist.on ? "Claude turned on for this document" : "Claude turned off"); }}));
  row.appendChild(el("span",{class:"hint",style:"margin:0",text:S.assist.label}));
  box.appendChild(row);
  return box;
}

async function assistRun(action, body, onDone){
  if(S.assist.busy) return;
  S.assist.busy = true; render();
  try{
    const j = await api("/api/assist",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(Object.assign({action, doc:S.doc}, body||{}))});
    S.assist.busy = false;
    onDone(j);
  }catch(err){
    S.assist.busy = false; S.assist.error = err.message; render();
    say("That did not work: " + err.message);
  }
}

function viewImages(v){
  const imgs=[]; S.doc.pages.forEach(p=>p.elements.forEach(e=>{
    if(e.kind==="image") imgs.push(e); }));
  const need = imgs.filter(e=> e.role==="Figure" && !(e.alt||"").trim()).length;
  v.appendChild(intro(hasFields() ? "Describe the images and name the fields"
                                  : "Describe the images",
    need ? need+" image"+(need===1?"":"s")+" still need"+(need===1?"s":"")+" a description."
         : "Every image is either described or marked decorative.",
    ["Anything that carries meaning needs a description. Anything that is pure decoration, a logo, a background shape, a divider, should be marked decorative so it is skipped rather than described.",
     "Write what a person would miss if the image were not there. If the image is a screenshot of text, the words need to be in the description. “Image”, “chart” and a filename all pass automated checkers and tell a reader nothing."],
    "figures"));

  if(S.help){
    const row = el("div",{class:"row",style:"gap:.4rem;margin-bottom:1rem;flex-wrap:wrap"});
    const panels = [];
    [["alt","How do I write a good description?"],
     ["decorative","When should I mark something decorative?"]].forEach(([topic,lbl])=>{
      const [btn, panel] = helpFor(topic);
      if(!btn) return;
      btn.textContent = lbl; btn.className = "mini info"; btn.removeAttribute("style");
      row.appendChild(btn); panels.push(panel);
    });
    v.appendChild(row);
    panels.forEach(x=> v.appendChild(x));
  }

  if(S.assist.on && need){
    const bar = el("div",{class:"row",style:"gap:.5rem;margin:0 0 1rem;flex-wrap:wrap"});
    bar.appendChild(el("button",{class:"btn ghost",type:"button",
      disabled:S.assist.busy?"disabled":null,
      text: S.assist.busy ? "Drafting\u2026"
                          : "Draft the "+need+" missing description"+(need===1?"":"s"),
      onclick:()=> assistRun("alt", {ids: imgs.filter(e=> e.role==="Figure" &&
          !(e.alt||"").trim()).map(e=>e.id)}, j=>{
        absorb(j); render();
        say((j.drafted||0)+" description"+((j.drafted||0)===1?"":"s")+
            " drafted. Read each one against its picture before you export.");
      })}));
    bar.appendChild(el("span",{class:"hint",style:"margin:0",
      text:"Each one arrives as a draft, unread, and still counts as outstanding."}));
    v.appendChild(bar);
  }

  fieldsPanel(v);

  if(!imgs.length){ v.appendChild(el("div",{class:"panel"},[
    el("p",{text:"No images were found in this PDF."})])); return; }

  const list = el("ul",{class:"figs"});
  imgs.forEach(e=>{
    const dec = e.role==="Artifact";
    const box = e.bbox.map(n=>Math.round(n)).join(",");
    const ta = el("textarea",{rows:"3",id:"alt-"+e.id,
      placeholder:"What does this show?"});
    ta.value = e.alt||"";
    ta.oninput = ()=>{ e.alt=ta.value; save(500);
      const host = ta.closest("li");
      if(host) host.querySelectorAll("[data-warn]").forEach(n=>{
        n.hidden = !!ta.value.trim(); }); };
    const toggle = el("button",{class:"mini toggle",type:"button","aria-pressed":String(dec),
      "aria-label":(dec?"Decorative — will be skipped":"Mark as decorative")+
        ": image on page "+(e.page+1)+", "+
        Math.round(e.bbox[2]-e.bbox[0])+" by "+Math.round(e.bbox[3]-e.bbox[1])+" points",
      text:dec?"Decorative — will be skipped":"Mark as decorative",
      onclick:()=>{ e.role = dec ? "Figure" : "Artifact";
        if(e.role==="Artifact") e.alt="";
        renumber(e.page); save(0); render();
        say(e.role==="Artifact"?"Marked decorative":"Now needs a description"); }});
    const problems = (S.issues||[]).filter(i=>i.id===e.id&&i.kind==="alt");
    list.appendChild(el("li",{},[
      el("div",{},[
        el("img",{src:"/api/crop?n="+e.page+"&box="+box,
          alt:"Detail from page "+(e.page+1)+" showing the image being described."}),
        el("p",{class:"meta",text:"Page "+(e.page+1)+" · "+
          Math.round(e.bbox[2]-e.bbox[0])+"×"+Math.round(e.bbox[3]-e.bbox[1])+"pt"}),
        el("p",{class:"meta"},[el("button",{class:"mini jump",type:"button",
          text:"See it on the page",
          "aria-label":"Show page "+(e.page+1)+" with this image highlighted",
          onclick:()=>{ S.page=e.page; S.sel=e.id; focusOn(e);
            S.itemTo=e.id; go(2); }})])]),
      el("div",{},[
        el("div",{class:"field"},[
          el("label",{for:"alt-"+e.id,text:"Description"}),
          dec ? el("p",{class:"hint",text:"Skipped, so no description is needed."}) : ta]),
        el("div",{class:"row"},[toggle]),
        e.note ? el("p",{class:"meta",text:e.note}) : null,
        ...problems.map(i=>el("p",{class:"meta","data-warn":"1",
          style:"color:#A5124B", text:i.message+" "+i.fix}))
      ])
    ]));
  });
  v.appendChild(list);
}

/* ---------- step 4: export ---------- */
function viewExport(v){
  const s=S.summary;
  v.appendChild(intro("Check and export",
    "Anything below that says “needed” will stop the file being conformant.",
    ["Warnings will not stop it, but they are the things a real reader notices.",
     "On export the file is checked against PDF/UA, the accessibility standard for PDFs, and you are told exactly what passed and what did not."],
    "conformance"));

  if(s.to_check){
    v.appendChild(el("div",{class:"unseen",role:"note"},[
      el("p",{style:"margin:0 0 .35rem",html:"<strong>"+s.to_check+
        (s.to_check===1?" item was":" items were")+" tagged by guesswork and "+
        (s.to_check===1?"has":"have")+" not been checked.</strong>"}),
      el("p",{style:"margin:0 0 .45rem",
        text:"These are the ones where the layout did not make the answer obvious, "+
             "usually a bold label that could be a heading, or something sitting "+
             "between two columns. Nothing downstream will question them."}),
      el("div",{},[el("button",{class:"mini jump",type:"button",
        text:"Review them now",
        onclick:()=>{ const first = toCheck()[0];
          if(first){ S.page=first.page; S.sel=first.id; S.onlyCheck=true; go(2); } }})])]));
  }

  // The mistake worth catching: skipping straight here without looking at the
  // later pages, which is easy to do and invisible once the file is written.
  const unseen = unseenPages();
  if(unseen.length && s.pages>1){
    const list = unseen.length>8
      ? unseen.slice(0,8).map(n=>n+1).join(", ")+" and "+(unseen.length-8)+" more"
      : unseen.map(n=>n+1).join(", ");
    v.appendChild(el("div",{class:"unseen",role:"note"},[
      el("p",{style:"margin:0 0 .35rem",html:"<strong>You have not looked at "+
        (unseen.length===1?"page ":"pages ")+list+" yet.</strong>"}),
      el("p",{style:"margin:0 0 .45rem",
        text:"You can export without doing that, but nothing downstream checks whether a page reads in a sensible order, so an unreviewed page is the most likely place for a problem to survive."}),
      el("div",{},[el("button",{class:"mini jump",type:"button",
        text:"Go to page "+(unseen[0]+1),
        onclick:()=>{ S.page=unseen[0]; go(2); }})])]));
  }
  v.appendChild(el("div",{class:"stats"},[
    stat(s.pages,"pages"), stat(s.tagged,"items tagged"),
    stat(s.headings,"headings"),
    stat(s.figures_described+"/"+s.figures,"images described"),
    stat(s.blockers,"still needed"), stat(s.warnings,"warnings")]));

  if(S.result) v.appendChild(resultPanel(S.result));

  const btns = el("div",{class:"panel",style:"margin-bottom:1rem"},[
    el("h3",{text:"Export"}),
    el("p",{class:"hint",text:"Your original file is left exactly as it is. The tagged copy is written as a new file."}),
    el("div",{class:"row",style:"gap:.6rem;flex-wrap:wrap"},[
      el("button",{class:"btn pink",type:"button",id:"exp",
        disabled:S.exporting?"disabled":null,
        onclick:()=>doExport(true)},[
        S.exporting?el("span",{class:"spin","aria-hidden":"true"}):null,
        el("span",{text:S.exporting?" Working…":"Export accessible PDF…"})]),
      el("button",{class:"btn ghost",type:"button",disabled:S.exporting?"disabled":null,
        text:"Save beside the original",onclick:()=>doExport(false)})])]);
  v.appendChild(btns);

  const iss = S.issues||[];
  const groups = [["blocker","Needed"],["warning","Worth fixing"],["suggestion","Have a look"]];
  groups.forEach(([sev,title])=>{
    const mine = iss.filter(i=>i.severity===sev);
    if(!mine.length) return;
    v.appendChild(el("h3",{text:title+" ("+mine.length+")",style:"margin-top:1.1rem"}));
    const ul = el("ul",{class:"issues"});
    mine.slice(0,40).forEach(i=>{
      ul.appendChild(el("li",{"data-sev":sev},[
        el("div",{class:"sev",text:sev==="blocker"?"needed":sev}),
        el("div",{text:i.message}),
        i.fix?el("p",{class:"fix",text:i.fix}):null,
        i.id?el("div",{class:"go"},[el("button",{class:"mini jump",type:"button",
          text:"Go to it"+(i.page!==null?" (page "+(i.page+1)+")":""),
          onclick:()=>{ const e=findEl(i.id); if(!e) return;
            S.page=e.page; S.sel=e.id; focusOn(e); S.itemTo=e.id;
            go(i.kind==="alt"?3:2); }})]):null
      ]));
    });
    if(mine.length>40) ul.appendChild(el("li",{},[el("p",{class:"fix",
      text:"and "+(mine.length-40)+" more of the same kind."})]));
    v.appendChild(ul);
  });
  if(!iss.length) v.appendChild(el("div",{class:"panel"},[
    el("p",{text:"Nothing outstanding. Worth a last look at the reading order on any busy slide before you send it."})]));
}

function resultPanel(r){
  const v = r.verapdf;
  const pass = v && v.compliant;
  const box = el("div",{class:"result "+(pass?"pass":"fail"),role:"region",
    "aria-label":"Export result"});
  box.appendChild(el("h2",{text: pass ? "Exported and conformant"
    : (v ? "Exported, but not yet conformant" : "Exported, not verified here")}));
  box.appendChild(el("p",{},[el("span",{text:"Saved to "}),
    el("strong",{text:r.out})]));
  if(v) box.appendChild(el("p",{text:"PDF/UA-1: "+v.passed+" of "+(v.passed+v.failed)+
    " rules pass"+(v.failed?", "+v.failedChecks+" failed checks":"")+"."}));
  else box.appendChild(el("p",{class:"fix",
    // Telling a non-technical user to run a brew command is no help. Say what
    // did happen, and what is simply unverified.
    text:"The tags were written and the text was checked. What could not be done "+
         "on this Mac is the independent conformance check, because the checker "+
         "(veraPDF) is not installed. The file is still tagged; it just has not "+
         "been given a formal pass or fail. Ask whoever sent you this app if you "+
         "need that verdict."}));
  if(v && v.rules && v.rules.length){
    const ul=el("ul");
    v.rules.forEach(x=>ul.appendChild(el("li",{text:x.clause+" test "+x.test+": "+
      x.description+" ("+x.checks+" checks)"})));
    box.appendChild(ul);
  }
  const ex = r.extraction;
  if(ex && !ex.ok) box.appendChild(el("p",{class:"fix",
    text:"Warning: the text does not extract cleanly ("+ex.stranded+
      " stranded letters). A screen reader will read broken words. This comes from the fonts in the original file, so it has to be fixed there — tagging cannot repair it."}));
  box.appendChild(el("p",{class:"fix",style:"margin-top:.5rem",
    text:"Conformance is a floor, not proof the document reads well. No checker can tell whether a description is useful or whether the reading order makes sense — that is what you confirmed on the way here."}));
  box.appendChild(el("div",{class:"row",style:"gap:.5rem;margin-top:.6rem"},[
    el("button",{class:"btn ghost",type:"button",text:"Show in Finder",
      onclick:()=>api("/api/reveal",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({path:r.out})}).catch(()=>{})})]));
  return box;
}

async function doExport(ask){
  S.exporting=true; S.error=""; render(); say("Writing the tagged PDF and checking it");
  try{
    const j = await api("/api/export",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({doc:S.doc, ask:!!ask})});
    S.exporting=false;
    if(j.cancelled){ render(); return; }
    S.result=j; if(j.summary) S.summary=j.summary;
    render();
    say(j.verapdf&&j.verapdf.compliant ? "Exported and conformant." : "Exported.");
    const h=document.querySelector(".result h2"); if(h){ h.tabIndex=-1; h.focus(); }
  }catch(err){ S.exporting=false; S.error=err.message; render(); }
}

/* ---------- help toggle ---------- */
function renderHelpToggle(){
  const b = document.getElementById("helptog");
  b.setAttribute("aria-pressed", String(S.help));
  b.setAttribute("aria-label", S.help
    ? "Help tips are on. Turn them off to hide the explanations."
    : "Help tips are off. Turn them on to show explanations.");
  document.getElementById("helptoglabel").textContent =
    S.help ? "Help tips on" : "Help tips off";
}
document.getElementById("helptog").onclick = ()=>{
  S.help = !S.help;
  store("help", S.help);
  renderHelpToggle();
  render();
  say(S.help ? "Help tips on" : "Help tips off");
};

/* ---------- quit ---------- */
function renderQuitButton(){
  const b = document.getElementById("quit");
  if(b) b.hidden = !!S.native;
}
document.getElementById("quit").onclick = async ()=>{
  // The app is a local server, so closing the tab would leave it running.
  const body = document.querySelector(".app");
  try{ await api("/api/quit",{method:"POST"}); }catch(e){}
  body.innerHTML = "";
  const p = el("div",{class:"bye"},[
    el("h2",{text:"PDF Tagger has stopped"}),
    el("p",{text:"You can close this tab. Any file you exported is untouched."})]);
  body.appendChild(p);
  const h = p.querySelector("h2"); h.tabIndex=-1; h.focus();
  document.title = "PDF Tagger — stopped";
};

/* ---------- boot ---------- */
(async ()=>{
  S.help = recall("help", true);
  renderHelpToggle();
  try{ absorb(await api("/api/state")); }catch(e){ S.error=e.message; }
  renderQuitButton();
  if(S.loaded) S.step=1;
  render();
})();
</script>
</body>
</html>
